<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 136 136">
  <!-- Table -->
  <circle cx="100" cy="100" r="45" fill="#8B6914" />
  <!-- 6 chairs evenly spaced at 60 degree intervals -->
  <!-- Chair at 0° (top) -->
  <g transform="rotate(0, 100, 100)">
    <path d="M 85,42 A 15,8 0 0,1 115,42" fill="#6B7280" />
  </g>
  <!-- Chair at 60° -->
  <g transform="rotate(60, 100, 100)">
    <path d="M 85,42 A 15,8 0 0,1 115,42" fill="#6B7280" />
  </g>
  <!-- Chair at 120° -->
  <g transform="rotate(120, 100, 100)">
    <path d="M 85,42 A 15,8 0 0,1 115,42" fill="#6B7280" />
  </g>
  <!-- Chair at 180° -->
  <g transform="rotate(180, 100, 100)">
    <path d="M 85,42 A 15,8 0 0,1 115,42" fill="#6B7280" />
  </g>
  <!-- Chair at 240° -->
  <g transform="rotate(240, 100, 100)">
    <path d="M 85,42 A 15,8 0 0,1 115,42" fill="#6B7280" />
  </g>
  <!-- Chair at 300° -->
  <g transform="rotate(300, 100, 100)">
    <path d="M 85,42 A 15,8 0 0,1 115,42" fill="#6B7280" />
  </g>
</svg>
